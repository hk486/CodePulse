# CodePulse - Full Stack Docker Compose
# Version: 1.0.0
# Services: Backend API, Frontend UI, CLI

services:
  # ============================================================================
  # BACKEND API
  # Express.js + SQLite REST API on port 5000
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codepulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - CLI_PATH=/app/cli
      - API_URL=http://localhost:5000/api
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/data:/app/data
      - ./uploads:/app/uploads
      - .:/home/harneet/codePulse:ro
    networks:
      - codepulse-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # FRONTEND UI
  # React + Vite on port 3000
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: codepulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000/api
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codepulse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # CLI TOOL
  # Command-line interface for local analysis
  # ============================================================================
  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    container_name: codepulse-cli
    restart: "no"
    volumes:
      - ./:/app/workspace:rw
      - ./cli/data:/app/cli/data:rw
    environment:
      - NODE_ENV=production
    working_dir: /app/cli
    command: ["sh", "-c", "echo 'CodePulse CLI is ready. Run: docker exec -it codepulse-cli npx ts-node src/cli.ts scan /app/workspace/<your-project-path>' && tail -f /dev/null"]
    networks:
      - codepulse-network

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  codepulse-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  backend-data:
    driver: local
  uploads-data:
    driver: local
