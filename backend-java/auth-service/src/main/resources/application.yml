spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:13306/codepulse_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=60000&socketTimeout=60000
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8001

jwt:
  secret: ${JWT_SECRET:codepulse-secret-key-change-in-production}
  expiration: 86400000
